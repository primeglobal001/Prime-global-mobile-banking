<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prime Global Mobile Banking - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;
      padding: 40px;
    }
    .box {
      background: white;
      padding: 30px;
      max-width: 400px;
      margin: auto;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      background: #0b3c5d;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .disclaimer {
      color: red;
      font-size: 14px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Login</h1>
    <input type="text" placeholder="Username" id="username">
    <input type="password" placeholder="Password" id="password">
    <button onclick="login()">Login</button>

    <p class="disclaimer">
      ⚠️ Simulation Only – Educational / Movie Use
    </p>
  </div>

  <script>
    function login() {
      // Fake login - just redirect to dashboard
      window.location.href = "dashboard.html";
    }
  </script>

</body>
</html>
