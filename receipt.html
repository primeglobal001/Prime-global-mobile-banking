<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prime Global Mobile Banking - Receipt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .app-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      padding: 30px;
      text-align: center;
    }
    h1 {
      color: #0b3c5d;
      margin-bottom: 10px;
    }
    .details {
      text-align: left;
      margin: 20px 0;
      font-size: 16px;
    }
    .details p {
      margin: 6px 0;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #0b3c5d, #1e5f7f);
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="card">
      <h1>Transaction Receipt</h1>

      <div class="details">
        <p><strong>Sender:</strong> <span id="sender"></span></p>
        <p><strong>Receiver:</strong> <span id="receiver"></span></p>
        <p><strong>Amount:</strong> <span id="amount"></span></p>
        <p><strong>Date:</strong> <span id="date"></span></p>
        <p><strong>Time:</strong> <span id="time"></span></p>
        <p><strong>Status:</strong> <span id="status"></span></p>
      </div>

      <button onclick="window.location.href='dashboard.html'">Back to Dashboard</button>
    </div>
  </div>

  <script>
    const transactions = JSON.parse(localStorage.getItem("pgmb_transactions") || "[]");
    const lastTx = transactions[transactions.length - 1] || {};

    document.getElementById("sender").innerText = lastTx.sender || "N/A";
    document.getElementById("receiver").innerText = lastTx.receiver || "N/A";
    const symbol = localStorage.getItem("pgmb_currency") || "$";
    document.getElementById("amount").innerText = symbol + (lastTx.amount || "0.00");
    document.getElementById("date").innerText = lastTx.date || "N/A";
    document.getElementById("time").innerText = lastTx.time || "N/A";
    document.getElementById("status").innerText = lastTx.status || "N/A";
  </script>

</body>
</html>
