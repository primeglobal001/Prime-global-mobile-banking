<!DOCTYPE html>
<html>
<head>
  <title>OTP Verification</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f4f6f8; }
    .box { background: white; padding: 20px; border-radius: 10px; }
    input, button {
      width: 100%; padding: 12px; margin-top: 10px;
    }
    button { background: #0b3c5d; color: white; border: none; }
  </style>
</head>
<body>

<div class="box">
  <h2>Enter OTP</h2>
  <input id="otp" placeholder="Enter OTP">
  <button onclick="verifyOTP()">Confirm</button>
</div>

<script>
function verifyOTP() {
  const entered = otp.value;
  const realOTP = localStorage.getItem("admin_otp");
  const status = localStorage.getItem("tx_status");

  if (entered === realOTP && status === "approved") {
    // Update balance (for simulation)
    let currentBalance = parseFloat(localStorage.getItem("pgmb_balance") || "5000");
    let transferAmount = parseFloat(localStorage.getItem("tx_amount") || "0");
    localStorage.setItem("pgmb_balance", currentBalance - transferAmount);
// Save transaction in localStorage
const now = new Date();
const transactions = JSON.parse(localStorage.getItem("pgmb_transactions") || "[]");
transactions.push({
  sender: localStorage.getItem("pgmb_username") || "Customer",
  receiver: localStorage.getItem("tx_receiver") || "Receiver",
  amount: transferAmount,
  status: "Approved",
  date: now.toLocaleDateString(),
  time: now.toLocaleTimeString()
});
localStorage.setItem("pgmb_transactions", JSON.stringify(transactions));
    window.location.href = "receipt.html"; // Redirect to receipt page
  } else if (status === "declined") {
    alert("Transaction Declined");
  } else {
    alert("Wrong OTP");
  }
}
</script>

</body>
</html>
