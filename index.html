<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prime Global Mobile Banking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;
      padding: 40px;
    }
    .box {
      background: white;
      padding: 30px;
      max-width: 420px;
      margin: auto;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    h1 {
      color: #0b3c5d;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      background: #0b3c5d;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .disclaimer {
      color: red;
      font-size: 14px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Prime Global Mobile Banking</h1>
    <p>Banking Simulator</p>

    <button>Login</button>
    <button>Register</button>

    <p class="disclaimer">
      ⚠️ Simulation Only – Educational / Movie Use<br>
      No real money • No real banking
    </p>
  </div>

</body>
</html>
