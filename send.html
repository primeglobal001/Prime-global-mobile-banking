<!DOCTYPE html>
<html>
<head>
  <title>Send Money</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f4f6f8; }
    .box { background: white; padding: 20px; border-radius: 10px; }
    input, button {
      width: 100%; padding: 12px; margin-top: 10px;
    }
    button { background: #0b3c5d; color: white; border: none; }
  </style>
</head>
<body>

<div class="box">
  <h2>Send Money</h2>
  <input id="receiver" placeholder="Receiver Name">
  <input id="amount" placeholder="Amount">
  <button onclick="requestOTP()">Continue</button>
</div>

<script>
function requestOTP() {
  localStorage.setItem("tx_receiver", receiver.value);
  localStorage.setItem("tx_amount", amount.value);
  window.location.href = "otp.html";
}
</script>

</body>
</html>
