<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prime Global Mobile Banking - Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .app-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      padding: 30px;
      text-align: center;
    }
    h1 {
      color: #0b3c5d;
      margin-bottom: 10px;
    }
    .balance {
      font-size: 24px;
      margin: 15px 0;
      color: #1e5f7f;
      font-weight: bold;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #0b3c5d, #1e5f7f);
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="card">
      <h1>Welcome, <span id="username"></span></h1>
      <div class="balance">Balance: <span id="balance"></span></div>

      <button onclick="window.location.href='send-money.html'">Send Money</button>
      <button onclick="window.location.href='admin-history.html'">Transaction History</button>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <script>
    const username = localStorage.getItem("pgmb_username") || "Customer";
    document.getElementById("username").innerText = username;

    const balance = parseFloat(localStorage.getItem("pgmb_balance") || "5000");
    const symbol = localStorage.getItem("pgmb_currency") || "$";
    document.getElementById("balance").innerText = symbol + balance.toFixed(2);

    function logout() {
      localStorage.removeItem("pgmb_username");
      window.location.href = "login.html";
    }
  </script>

</body>
</html>
